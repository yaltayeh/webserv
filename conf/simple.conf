http {
    include       mime.types;

    server {
        listen ${PORT};
        # edit in /etc/hosts file
        server_name webserv.com www.webserv.com;
        root www/html;
        index index.html;
        autoindex on;
    
        error_page 404 /404.html;
        
        location / {
            allowed_methods GET POST;
            autoindex on;
        }

        location /download/ {
            alias www/files/;
            autoindex on;
            types { }
            default_type application/octet-stream;
        }
    }
    server {
        listen ${PORT};
         # edit in /etc/hosts file
        server_name ${USER}.com;
        root www/html2;
        index index.html;
        autoindex on;
        
        error_page 404 /404.html;
        
        location / {
            allowed_methods GET POST;
            autoindex on;
        }
    }
}