http {
    # Logging configuration
    log_level info warning error critical;
    log_show_location off;
    log_colored on;
    log_show_timestamp off;
    
    idle_timeout    5;
    include         mime.types;

    server {
        listen 80;

        # edit in /etc/hosts file
        server_name webserv.com www.webserv.com ${USER}.com;

        error_page 404 /404.html;
        root tests/www/html;

        location / {
            allowed_methods GET POST;
            index index.html index.htm;
        }

        location /download/ {
            alias tests/www/files/;
            autoindex on;
            types { }
            default_type application/octet-stream;
        }

        location /cgi-bin/ {
			root tests/www;
			cgi_pass /usr/bin/python3;
			cgi_extension .py;
			index index.py;
			allowed_methods GET POST;
		}
    }
}
