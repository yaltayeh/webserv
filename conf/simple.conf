http {
    idle_timeout    65;
    include         mime.types;

    server {
        listen 127.0.0.1:8080;

        # edit in /etc/hosts file
        server_name webserv.com www.webserv.com ${USER}.com;

        error_page 404 /404.html;

        location / {
            root www/html;
            allowed_methods GET POST;
            index index.html index.htm;
        }

        location /download/ {
            alias www/files/;
            autoindex on;
            types { }
            default_type application/octet-stream;
        }
    }
}
