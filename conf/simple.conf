http {
    include       mime.types;

    server {
        listen 80;
        # edit in /etc/hosts file
        server_name webserv.com www.webserv.com;
        root www/html;
        index index.html;
        autoindex on;
    
        error_page 404 /404.html;
        
        location / {
            allowed_methods GET POST;
            autoindex on;
        }

        location /download/ {
            alias www/files/;
            autoindex on;
            types {}
            default_type application/octet-stream;
        }
    }
    server {
        listen 80;
         # edit in /etc/hosts file
        server_name yaltayeh.42.fr;
        root html;
        index index.html;
        autoindex on;
        
        error_page 404 /404.html;
        
        location / {
            allowed_methods GET POST;
            autoindex on;
        }
    }
}