http {
    server {
        listen 3000;
        server_name z3ban.com;

		root YoupiBanane;
		
        # / → GET only
        location / {
            allowed_methods GET;
			autoindex on;
			
        }

        # /post_body → POST only, max body 100
        location /post_body {
            allowed_methods POST;
            max_body_size 100;
        }

        # .bla files → POST only, handled by CGI
        location .bla {
            allowed_methods POST;
            cgi_pass cgi_test;
        }

        # /directory/ → GET only
        # root = YoupiBanane
        # default file = *.bad_extension
        location /directory/ {
            allowed_methods GET;
            
            autoindex off;
            index youpi.bad_extension;
        }
    }
}
