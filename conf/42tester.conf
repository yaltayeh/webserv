http {
    server {
        listen 3000;
        server_name z3ban.com;

		root YoupiBanane;
		
        cgi_extension .bla;
        cgi_pass ./cgi_tester;
        
        # / → GET only
        location / {
            allowed_methods GET;
			autoindex on;

        }

        # /post_body → POST only, max body 100
        location /post_body {
            allowed_methods POST;
            max_body_size 100;
        }

        # /directory/ → GET only
        # root = YoupiBanane
        # default file = *.bad_extension
        location /directory/ {
            allowed_methods GET;
            
            autoindex off;
            index youpi.bad_extension;

        }
    }
}
