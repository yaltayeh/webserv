http {
	idle_timeout 5s;
	server {
		listen 80;
		
		error_page 404 /404.html;

		location /cgi-bin/ {
			root www;
			cgi_pass /usr/bin/python3;
			cgi_extension .py;
			index index.py;
			allowed_methods GET POST;
		}

		location / {
			allowed_methods GET POST;
			root www/html;
			index index.html;
			autoindex on;
		}
		
	}
}