http {
    deny 192.168.1.100;
    
    server {
        listen 80;
        server_name example.com;
        deny 10.0.0.0/8;
        
        location /public/ {
            root /var/www/public;
        }
        
        location /api/ {
            root /var/www/api;
            deny all;
            limit_except GET POST {
                deny all;
            }
        }
        
        location /admin/ {
            root /var/www/admin;
            deny 192.168.1.0/24;
            limit_except GET {
            }
        }
    }
}
