http {
    # HTTP level defaults
    client_max_body_size 10M;
    keepalive_timeout 60s 30s;
    error_page 500 502 503 504 /50x.html;
    cgi_extension .php .py;

    # First server - Main website on port 8080
    server {
        listen 127.0.0.1:8080;
        server_name localhost www.example.com example.com;
        root /var/www/html;
        index index.html index.htm;
        autoindex off;
        error_page 404 /404.html;
        error_page 403 /403.html;

        # Static files location
        location / {
            allowed_methods GET POST;
            index index.html;
        }

        # API location with redirect
        location /api {
            return 301 https://api.example.com;
        }

        # Downloads with autoindex
        location /downloads {
            allowed_methods GET;
            root /var/www/downloads;
            autoindex on;
        }

        # Upload location
        location /upload {
            allowed_methods POST PUT DELETE;
            upload_enable on;
            upload_store /var/www/uploads;
            client_max_body_size 50M;
        }

        # CGI scripts
        location ~ \.php$ {
            allowed_methods GET POST;
            root /var/www/cgi-bin;
            cgi_pass /usr/bin/php-cgi;
            cgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            cgi_param QUERY_STRING $query_string;
        }

        # Python CGI
        location ~ \.py$ {
            allowed_methods GET POST;
            root /var/www/cgi-bin;
            cgi_pass /usr/bin/python3;
            cgi_param SCRIPT_NAME $fastcgi_script_name;
        }
    }

    # Second server - Admin panel on port 8081
    server {
        listen 127.0.0.1:8081;
        server_name admin.example.com;
        root /var/www/admin;
        index admin.html;
        client_max_body_size 5M;

        location / {
            allowed_methods GET POST PUT DELETE;
        }

        location /secure {
            return 403;
        }
    }

    # Third server - Default server (catches all other requests)
    server {
        listen 0.0.0.0:80;
        server_name _;
        return 444;
    }
}
