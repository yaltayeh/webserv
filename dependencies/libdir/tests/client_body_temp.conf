http {
    client_body_temp_path /var/tmp/http_temp;
    
    server {
        listen 80;
        client_body_temp_path /var/tmp/server_temp 1;
        
        location /upload/ {
            client_body_temp_path /var/tmp/upload_temp 1 2 3;
        }
        
        location /api/ {
            # Uses server-level temp path
        }
    }
}
