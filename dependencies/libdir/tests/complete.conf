# Complete nginx-like configuration example
http {
    # HTTP-level settings
    client_max_body_size 10m;
    keepalive_timeout 65s;
    root /var/www;
    
    server {
        listen 8080 localhost;
        server_name example.com www.example.com;
        root /var/www/example;
        
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # Root location
        location / {
            root /var/www/html;
        }
        
        # API endpoints
        location /api/ {
            client_max_body_size 50m;
            error_page 404 /api/404.json;
            
            # Nested location for API v1
            location /api/v1/ {
                root /var/www/api/v1;
            }
            
            # Nested location for API v2
            location /api/v2/ {
                root /var/www/api/v2;
                client_max_body_size 100m;
            }
        }
        
        # Static files
        location ^~ /static/ {
            root /var/www/static;
        }
        
        # Exact match for homepage
        location = / {
            root /var/www/home;
        }
        
        # Case-sensitive regex for PHP files
        location ~ \.php$ {
            root /var/www/php;
        }
        
        # Case-insensitive regex for images
        location ~* \.(gif|jpg|jpeg|png|svg)$ {
            root /var/www/images;
        }
        
        # Named location for internal redirects
        location @fallback {
            root /var/www/fallback;
        }
    }
    
    server {
        listen 443;
        server_name secure.example.com;
        client_max_body_size 50m;
        
        location / {
            root /var/www/secure;
        }
    }
}
