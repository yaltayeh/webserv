<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register - Authentication Example</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			max-width: 500px;
			margin: 50px auto;
			padding: 20px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
		}
		.container {
			background-color: white;
			padding: 40px;
			border-radius: 10px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
		}
		h1 {
			color: #333;
			text-align: center;
			margin-bottom: 30px;
		}
		.form-group {
			margin-bottom: 20px;
		}
		label {
			display: block;
			margin-bottom: 5px;
			color: #555;
			font-weight: bold;
		}
		input[type="text"],
		input[type="password"],
		input[type="email"] {
			width: 100%;
			padding: 12px;
			border: 1px solid #ddd;
			border-radius: 5px;
			box-sizing: border-box;
			font-size: 14px;
		}
		input:focus {
			outline: none;
			border-color: #667eea;
		}
		button {
			width: 100%;
			background-color: #667eea;
			color: white;
			padding: 12px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-size: 16px;
			font-weight: bold;
		}
		button:hover {
			background-color: #5568d3;
		}
		.message {
			padding: 10px;
			margin: 15px 0;
			border-radius: 5px;
			display: none;
		}
		.success {
			background-color: #d4edda;
			color: #155724;
			border: 1px solid #c3e6cb;
		}
		.error {
			background-color: #f8d7da;
			color: #721c24;
			border: 1px solid #f5c6cb;
		}
		.links {
			text-align: center;
			margin-top: 20px;
		}
		.links a {
			color: #667eea;
			text-decoration: none;
		}
		.links a:hover {
			text-decoration: underline;
		}
		.requirements {
			font-size: 12px;
			color: #666;
			margin-top: 5px;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Register</h1>
		
		<div id="message" class="message"></div>
		
		<form id="registerForm" onsubmit="handleRegister(event)">
			<div class="form-group">
				<label for="username">Username:</label>
				<input type="text" id="username" name="username" required minlength="3">
				<div class="requirements">Minimum 3 characters</div>
			</div>
			
			<div class="form-group">
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" required>
			</div>
			
			<div class="form-group">
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" required minlength="6">
				<div class="requirements">Minimum 6 characters</div>
			</div>
			
			<div class="form-group">
				<label for="confirm_password">Confirm Password:</label>
				<input type="password" id="confirm_password" name="confirm_password" required>
			</div>
			
			<button type="submit">Register</button>
		</form>
		
		<div class="links">
			<p>Already have an account? <a href="/login.html">Login here</a></p>
			<p><a href="/">Back to Home</a></p>
		</div>
	</div>
	
	<script>
		async function handleRegister(event) {
			event.preventDefault();
			
			const username = document.getElementById('username').value;
			const email = document.getElementById('email').value;
			const password = document.getElementById('password').value;
			const confirmPassword = document.getElementById('confirm_password').value;
			const messageDiv = document.getElementById('message');
			
			// Validate passwords match
			if (password !== confirmPassword) {
				messageDiv.className = 'message error';
				messageDiv.textContent = 'Passwords do not match!';
				messageDiv.style.display = 'block';
				return;
			}
			
			try {
				const response = await fetch('/cgi-bin/register.py', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/x-www-form-urlencoded',
					},
					body: `username=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
				});
				
				const data = await response.json();
				
				if (data.success) {
					messageDiv.className = 'message success';
					messageDiv.textContent = 'Registration successful! Redirecting to login...';
					messageDiv.style.display = 'block';
					
					setTimeout(() => {
						window.location.href = '/login.html';
					}, 1500);
				} else {
					messageDiv.className = 'message error';
					messageDiv.textContent = data.message || 'Registration failed';
					messageDiv.style.display = 'block';
				}
			} catch (error) {
				messageDiv.className = 'message error';
				messageDiv.textContent = 'Error: ' + error.message;
				messageDiv.style.display = 'block';
			}
		}
		
		// Check if already logged in
		async function checkAuth() {
			try {
				const response = await fetch('/cgi-bin/check_auth.py');
				const data = await response.json();
				
				if (data.authenticated) {
					window.location.href = '/';
				}
			} catch (error) {
				console.error('Auth check failed:', error);
			}
		}
		
		checkAuth();
	</script>
</body>
</html>
