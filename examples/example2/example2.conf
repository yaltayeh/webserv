# Configuration for Example 2: Authentication System with Cookies


http {
	log_level ALL;

	include mime.types;

	server {
		listen 8082;
		server_name example2.local localhost;
		
		# Root directory for HTML files
		root examples/example2/html;
		index index.html;
		
		# Main pages
		location / {
			allowed_methods GET POST;
			autoindex off;
		}
		
		# CGI scripts for authentication
		location /cgi-bin/ {
			root examples/example2;
			allowed_methods GET POST;
			cgi_pass .py /usr/bin/python3;
		}
	}
}
