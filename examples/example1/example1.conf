# Configuration for Example 1: File Upload via CGI


http {
	log_level ALL;

	include mime.types;

	server {
		listen 8081;
		server_name example1.local localhost;
		
		# Root directory for HTML files
		root examples/example1/html;
		index index.html;
		
		# Main page
		location / {
			allowed_methods GET POST;
			autoindex off;
		}
		
		# CGI scripts
		location /cgi-bin/ {
			root examples/example1;
			allowed_methods GET POST;
			cgi_pass .py /usr/bin/python3;
		}
		
		# Uploaded files directory
		location /uploads/ {
			root examples/example1;
			allowed_methods GET;
			autoindex on;
		}
	}
}
