# ==================================================================================
# Webserv Configuration File
# ==================================================================================
# This file configures the behavior of the HTTP server.
# It uses a syntax similar to NGINX.
# Comments start with a '#' character.


# The 'http' block is the top-level context. All HTTP configuration goes inside here.
http {
    # ------------------------------------------------------------------------------
    # Global Settings
    # ------------------------------------------------------------------------------
    
    # 'client_body_temp_path' defines the directory where temporary files are stored
    # when a client request body is larger than the internal buffer.
    # Syntax: client_body_temp_path <absolute_path>;
    client_body_temp_path /tmp/webserv_body; # TODO: ask about levels.
    
    # ------------------------------------------------------------------------------
    # Server Block 1: Main Server
    # ------------------------------------------------------------------------------
    # A 'server' block defines a virtual server. You can have multiple server blocks
    # to handle different ports or different domain names (Virtual Hosting).
    server {
        # 'listen' specifies the IP address and port to listen on.
        # Syntax: listen <address>:<port>;
        listen 127.0.0.1:8080;

        # 'server_name' defines the domain names this server block answers for.
        # If the 'Host' header matches one of these, this block is used.
        # Syntax: server_name <name1> <name2> ...;
        server_name localhost www.example.com;

        # 'root' defines the base directory from which files are served.
        # A request for "/image.jpg" will try to find the file at "html/image.jpg".
        # Syntax: root <path>;
        root html; # TODO: is this relative or absolute?

		# html/images/index

        # 'index' defines the default file(s) to serve when a directory is requested.
        # The server checks these files in order.
        # Syntax: index <file1> <file2> ...;
        index index.html index.htm; # TODO: does this search in the root directory only, or in subdirectories too?

        # 'autoindex' enables or disables directory listing if no index file is found.
        # Options: on | off
        autoindex on;

        # 'autoindex_format' sets the output format of the directory listing.
        # This is useful for debugging or if you want JSON output for a frontend app.
        # Options: html | xml | json | jsonp
        autoindex_format html;

        # 'error_page' maps HTTP error codes to a specific URI.
        # When an error occurs (e.g., 404 Not Found), the server serves this page.
        # Syntax: error_page <code1> [code2...] <uri>;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        # 'client_max_body_size' limits the size of the client request body (e.g., file uploads).
        # Requests exceeding this limit receive a 413 (Payload Too Large) error.
        # Syntax: client_max_body_size <size><unit>; (k=KB, m=MB, g=GB)
        client_max_body_size 10m; # TODO: is the internal buffer size definable here too?
        
        # --------------------------------------------------------------------------
        # Location Blocks (Routes)
        # --------------------------------------------------------------------------
        # 'location' blocks define configuration for specific request URIs (paths).
        # The most specific match usually wins (or the longest prefix). # TODO: explain more.

        # Default location for the root path "/" and everything under it not matched elsewhere.
        location / {
            # 'allowed_methods' restricts which HTTP verbs are accepted.
            # If a method is not listed, the server returns 405 Method Not Allowed.
            allowed_methods GET POST;
            
            # You can override global/server settings inside a location.
            autoindex on;
        }

        # Location for private content.
        location /private {
            # Note on 'root':
            # With 'root html/private', a request for '/private/file.txt' 
            # maps to 'html/private/private/file.txt'.
            # The URI '/private' is appended to the root path.
            root html/private;

            # Disable directory listing for security.
            autoindex off;

            # Only allow GET requests (read-only).
            allowed_methods GET;

            # Specific index for this folder.
            index index.html;
        }

        # Redirection example.
        location /old-page {
            # 'return' sends an HTTP redirection or status code immediately.
            # 301 = Moved Permanently.
            # Syntax: return <code> <url_or_text>;
            return 400 /new-page;
        }

        # File upload configuration.
        location /upload {
            # Uploads typically use POST or PUT methods.
            allowed_methods POST PUT;

            # 'upload_enable' is a specific directive for this project to handle file uploads.
            upload_enable on;

            # 'upload_store' specifies where valid uploaded files are saved.
            # Make sure this directory exists and is writable by the server user!
            upload_store /home/z3ban/projects/42/web_serv/web-server/uploads;

            # Allow larger files (100MB) only for this route.
            client_max_body_size 100m;
        }

        # --------------------------------------------------------------------------
        # CGI Configuration (Dynamic Scripts)
        # --------------------------------------------------------------------------
        
        # Handle requests for CGI scripts (e.g., PHP).
        location /cgi-bin {
            root html/cgi-bin;

            # 'cgi_pass' defines the path to the CGI executable (interpreter).
            # The server will execute this program to process the request.
            # Syntax: cgi_pass <absolute_path_to_executable>;
            cgi_pass /usr/bin/php-cgi;

            # 'cgi_extension' lists file extensions that trigger CGI execution.
            # Syntax: cgi_extension <ext1> <ext2> ...;
            cgi_extension .php .py; # TODO: does the php-cgi handle .py too?

            # CGIs often need POST for form data and GET for query parameters.
            allowed_methods GET POST;
        }
        
        # Another CGI example (e.g., Python API).
        location /python-api {
            # 'alias' maps the URI location to a specific path on the filesystem.
            # Unlike 'root', the location part of the URI is DROPPED.
            # Request: /python-api/script.py -> maps to -> html/python-scripts/script.py
            alias html/python-scripts;

            # Use Python interpreter.
            cgi_pass /usr/bin/python3;

            # Handle .py files.
            cgi_extension .py;
        }
    }

    # ------------------------------------------------------------------------------
    # Server Block 2: Secondary Server
    # ------------------------------------------------------------------------------
    server {
        # Listening on a different port.
        listen 127.0.0.1:8081;

        # Server name for this block.
        server_name test.com;

        # Different root directory for this virtual host.
        root html/test_site;
        index home.html;
        
        # Access control example.
        location /restricted {
            # 'deny' blocks access.
            # 'deny all' returns 403 Forbidden to everyone.
            # You might also support 'deny 192.168.1.1' if implemented.
            deny all;
        }
    }
}